name: Release Cloudflare Manager

on:
  push:
    branches:
      - master
      - production
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-cloudflare-manager
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Linux Packages (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Build Dependencies & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev \
            rpm dpkg-dev

      - name: Setup Node.js (for Web Dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compute Release Tag & Version
        id: versioning
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '"')
          VER=$(echo "$RAW_VER" | cut -d'+' -f1)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" == "production" ]]; then
            TAG="v${VER}-b${{ github.run_number }}"
          else
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build Web Dashboard (Angular)
        run: |
          if [ -d "web" ] && [ -f "web/package.json" ]; then
            cd web
            npm ci
            npm run build
            cd ..
          fi

      - name: Build Flutter Linux Release
        run: |
          flutter pub get
          flutter build linux --release

      - name: Build .deb Package
        run: |
          chmod +x scripts/build_deb.sh
          bash scripts/build_deb.sh

      - name: Build .rpm Package
        run: |
          chmod +x scripts/build_rpm.sh
          bash scripts/build_rpm.sh

      - name: Build .tar.gz Archive
        run: |
          ARCHIVE_NAME="cloudflare-manager_${{ steps.versioning.outputs.version }}_linux_x64.tar.gz"
          tar -czf "build/$ARCHIVE_NAME" -C build/linux/x64/release/bundle .
          echo "Created build/$ARCHIVE_NAME"

      - name: Collect Release Artifacts
        id: collect
        run: |
          mkdir -p release-artifacts
          cp build/*.deb release-artifacts/ 2>/dev/null || true
          cp build/*.rpm release-artifacts/ 2>/dev/null || true
          cp build/*.tar.gz release-artifacts/ 2>/dev/null || true
          echo "=== Release Artifacts ==="
          ls -lh release-artifacts/

      - name: Publish Release Packages to GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: 'Cloudflare Manager ${{ steps.versioning.outputs.tag }}'
          body: |
            ### 🌐 Cloudflare Manager Release ${{ steps.versioning.outputs.tag }}

            Automated release build for Linux (x86_64).

            #### Available Packages:
            - **Debian / Ubuntu**: `.deb` package
              ```bash
              sudo dpkg -i cloudflare-manager_*_amd64.deb
              ```
            - **Fedora / RHEL / openSUSE**: `.rpm` package
              ```bash
              sudo dnf install cloudflare-manager-*.x86_64.rpm
              ```
            - **Generic Linux**: Standalone `.tar.gz` bundle
              ```bash
              tar -xzf cloudflare-manager_*_linux_x64.tar.gz
              ./cloudflare_manager
              ```

            - **Commit**: `${{ github.sha }}`
            - **Date**: ${{ steps.versioning.outputs.date }}
          files: release-artifacts/*
          make_latest: true
